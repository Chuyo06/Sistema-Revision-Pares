name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-microservice:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [usuarios, manuscritos, revision, matching, analisis-ia]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        working-directory: microservices/${{ matrix.service }}
        run: |
          npm ci

      - name: Run tests
        working-directory: microservices/${{ matrix.service }}
        run: |
          npm test --silent
