<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 720">
  <!-- Phone frame background -->
  <rect width="540" height="720" fill="#f5f0e8"/>
  
  <!-- Header -->
  <rect width="540" height="80" fill="#5d4037"/>
  <text x="270" y="50" font-size="28" fill="white" text-anchor="middle" font-weight="bold">Rev. por Pares</text>
  
  <!-- Menu items -->
  <rect x="20" y="110" width="500" height="70" fill="white" rx="8" stroke="#ddd" stroke-width="1"/>
  <text x="40" y="150" font-size="18" fill="#5d4037" font-weight="bold">📄 Mis Manuscritos</text>
  
  <rect x="20" y="200" width="500" height="70" fill="white" rx="8" stroke="#ddd" stroke-width="1"/>
  <text x="40" y="240" font-size="18" fill="#5d4037" font-weight="bold">📋 Revisiones Pendientes</text>
  
  <rect x="20" y="290" width="500" height="70" fill="white" rx="8" stroke="#ddd" stroke-width="1"/>
  <text x="40" y="330" font-size="18" fill="#5d4037" font-weight="bold">⭐ Evaluaciones Recibidas</text>
  
  <rect x="20" y="380" width="500" height="70" fill="white" rx="8" stroke="#ddd" stroke-width="1"/>
  <text x="40" y="420" font-size="18" fill="#5d4037" font-weight="bold">👥 Mi Perfil</text>
  
  <!-- Status indicators -->
  <circle cx="520" cy="145" r="12" fill="#FF9800"/>
  <text x="520" y="150" font-size="10" fill="white" text-anchor="middle">2</text>
  
  <!-- Footer indication - offline capable -->
  <rect x="20" y="650" width="500" height="40" fill="#4CAF50" rx="8"/>
  <text x="270" y="675" font-size="14" fill="white" text-anchor="middle" font-weight="bold">✓ Funciona sin conexión</text>
</svg>
