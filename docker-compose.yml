services:
  # ==========================================
  # BASES DE DATOS 
  # ==========================================
  mariadb:
    image: mariadb:latest
    container_name: mi_mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: mi_base_datos
    volumes:
      - ./database/mariadb/init:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:latest
    container_name: mi_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27017:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: mi_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # MICROSERVICIOS NESTJS
  # ==========================================
  usuarios:
    build:
      context: ./microservices/usuarios
      dockerfile: Dockerfile
    container_name: ms_usuarios
    ports:
      - "3001:3000"
    env_file: .env
    environment:
      - NODE_ENV=development
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./microservices/usuarios:/app
      - /app/node_modules

  manuscritos:
    build:
      context: ./microservices/manuscritos
      dockerfile: Dockerfile
    container_name: ms_manuscritos
    ports:
      - "3002:3000"
    env_file: .env
    environment:
      - NODE_ENV=development
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - ./microservices/manuscritos:/app
      - /app/node_modules
      - ./uploads:/app/uploads

  revision:
    build:
      context: ./microservices/revision
      dockerfile: Dockerfile
    container_name: ms_revision
    ports:
      - "3003:3000"
    env_file: .env
    environment:
      - NODE_ENV=development
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - ./microservices/revision:/app
      - /app/node_modules

  matching:
    build:
      context: ./microservices/matching
      dockerfile: Dockerfile
    container_name: ms_matching
    ports:
      - "3004:3000"
    env_file: .env
    environment:
      - NODE_ENV=development
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./microservices/matching:/app
      - /app/node_modules

  analisis-ia:
    build:
      context: ./microservices/analisis-ia
      dockerfile: Dockerfile
    container_name: ms_analisis_ia
    ports:
      - "3005:3000"
    env_file: .env
    environment:
      - NODE_ENV=development
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./microservices/analisis-ia:/app
      - /app/node_modules

  notificaciones:
    build:
      context: ./microservices/notificaciones
      dockerfile: Dockerfile
    container_name: ms_notificaciones
    ports:
      - "3006:3000"
    env_file: .env
    environment:
      - NODE_ENV=development
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - ./microservices/notificaciones:/app
      - /app/node_modules

  gateway:
    image: nginx:alpine
    container_name: ms_gateway
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - usuarios
      - manuscritos
      - revision
      - matching
      - analisis-ia
      - notificaciones