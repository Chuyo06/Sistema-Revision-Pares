events {
    worker_connections 1024;
}

http {
    client_max_body_size 10M;

    # Usar el DNS interno de Docker para resolver nombres de servicio dinámicamente.
    # Esto evita que Nginx cachee IPs viejas cuando los contenedores se reconstruyen.
    resolver 127.0.0.11 valid=5s;
    resolver_timeout 5s;

    server {
        listen 80;
        absolute_redirect off;

        # Preservar Host original para que los redirects del backend no pierdan el puerto
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Aumentar tiempos de espera para evitar timeouts durante recompilación de NestJS
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # ─── USUARIOS ─────────────────────────────────────────────
        # /api/usuarios/... → usuarios:3000/...
        location /api/usuarios/ {
            set $upstream_usuarios usuarios:3000;
            rewrite ^/api/usuarios/(.*)$ /$1 break;
            proxy_pass http://$upstream_usuarios;
        }
        location = /api/usuarios {
            set $upstream_usuarios usuarios:3000;
            proxy_pass http://$upstream_usuarios/;
        }

        # ─── AUTH (dentro de usuarios) ────────────────────────────
        # /api/auth/... → usuarios:3000/auth/...
        location /api/auth/ {
            set $upstream_auth usuarios:3000;
            rewrite ^/api/auth/(.*)$ /auth/$1 break;
            proxy_pass http://$upstream_auth;
        }
        location = /api/auth {
            set $upstream_auth usuarios:3000;
            proxy_pass http://$upstream_auth/auth;
        }

        # ─── MANUSCRITOS ──────────────────────────────────────────
        # /api/manuscritos/... → manuscritos:3000/manuscritos/...
        location /api/manuscritos/ {
            set $upstream_manuscritos manuscritos:3000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$upstream_manuscritos;
        }
        location = /api/manuscritos {
            set $upstream_manuscritos manuscritos:3000;
            proxy_pass http://$upstream_manuscritos/manuscritos;
        }
        
        # ─── CONVOCATORIAS (dentro de manuscritos) ────────────────
        # /api/convocatorias/... → manuscritos:3000/convocatorias/...
        location /api/convocatorias/ {
            set $upstream_convocatorias manuscritos:3000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$upstream_convocatorias;
        }
        location = /api/convocatorias {
            set $upstream_convocatorias manuscritos:3000;
            proxy_pass http://$upstream_convocatorias/convocatorias;
        }

        # ─── REVISIÓN ─────────────────────────────────────────────
        # /api/revision/... → revision:3000/...
        location /api/revision/ {
            set $upstream_revision revision:3000;
            rewrite ^/api/revision/(.*)$ /$1 break;
            proxy_pass http://$upstream_revision;
        }
        location = /api/revision {
            set $upstream_revision revision:3000;
            proxy_pass http://$upstream_revision/;
        }

        # ─── ANÁLISIS IA ──────────────────────────────────────────
        # /api/analisis/... → analisis-ia:3000/...
        location /api/analisis/ {
            set $upstream_analisis analisis-ia:3000;
            rewrite ^/api/analisis/(.*)$ /$1 break;
            proxy_pass http://$upstream_analisis;
        }
        location = /api/analisis {
            set $upstream_analisis analisis-ia:3000;
            proxy_pass http://$upstream_analisis/;
        }

        # ─── MATCHING ─────────────────────────────────────────────
        # /api/matching/... → matching:3000/...
        location /api/matching/ {
            set $upstream_matching matching:3000;
            rewrite ^/api/matching/(.*)$ /$1 break;
            proxy_pass http://$upstream_matching;
        }
        location = /api/matching {
            set $upstream_matching matching:3000;
            proxy_pass http://$upstream_matching/;
        }

        # ─── NOTIFICACIONES ───────────────────────────────────────
        # /api/notificaciones/... → notificaciones:3000/...
        location /api/notificaciones/ {
            set $upstream_notificaciones notificaciones:3000;
            rewrite ^/api/notificaciones/(.*)$ /$1 break;
            proxy_pass http://$upstream_notificaciones;
        }
        location = /api/notificaciones {
            set $upstream_notificaciones notificaciones:3000;
            proxy_pass http://$upstream_notificaciones/;
        }

        # Bienvenida
        location / {
            return 200 'API Gateway de Sistema de Revision de Pares funcionando!';
            add_header Content-Type text/plain;
        }
    }
}
