events {
    worker_connections 1024;
}

http {
    client_max_body_size 10M;

    # Definición de los backends
    upstream usuarios_backend       { server usuarios:3000; }
    upstream manuscritos_backend    { server manuscritos:3000; }
    upstream revision_backend       { server revision:3000; }
    upstream analisis_backend       { server analisis-ia:3000; }
    upstream matching_backend       { server matching:3000; }
    upstream notificaciones_backend { server notificaciones:3000; }

    server {
        listen 80;
        absolute_redirect off;

        # Preservar Host original para que los redirects del backend no pierdan el puerto
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ─── USUARIOS ─────────────────────────────────────────────
        location /api/usuarios/ { proxy_pass http://usuarios_backend/; }
        location /api/usuarios  { proxy_pass http://usuarios_backend/; }

        # ─── AUTH (dentro de usuarios) ────────────────────────────
        location /api/auth/     { proxy_pass http://usuarios_backend/auth/; }
        location /api/auth      { proxy_pass http://usuarios_backend/auth; }

        # ─── MANUSCRITOS ──────────────────────────────────────────
        location = /api/manuscritos    { proxy_pass http://manuscritos_backend/manuscritos; }
        location   /api/manuscritos/   { proxy_pass http://manuscritos_backend/manuscritos/; }
        
        # ─── CONVOCATORIAS (dentro de manuscritos) ────────────────
        location = /api/convocatorias  { proxy_pass http://manuscritos_backend/convocatorias; }
        location   /api/convocatorias/ { proxy_pass http://manuscritos_backend/convocatorias/; }

        # ─── REVISIÓN ─────────────────────────────────────────────
        location = /api/revision       { proxy_pass http://revision_backend/; }
        location   /api/revision/      { proxy_pass http://revision_backend/; }

        # ─── ANÁLISIS IA ──────────────────────────────────────────
        location = /api/analisis       { proxy_pass http://analisis_backend/; }
        location   /api/analisis/      { proxy_pass http://analisis_backend/; }

        # ─── MATCHING ─────────────────────────────────────────────
        location = /api/matching       { proxy_pass http://matching_backend/; }
        location   /api/matching/      { proxy_pass http://matching_backend/; }

        # ─── NOTIFICACIONES ───────────────────────────────────────
        location = /api/notificaciones { proxy_pass http://notificaciones_backend/; }
        location   /api/notificaciones/ { proxy_pass http://notificaciones_backend/; }

        # Bienvenida
        location / {
            return 200 'API Gateway de Sistema de Revision de Pares funcionando!';
            add_header Content-Type text/plain;
        }
    }
}
